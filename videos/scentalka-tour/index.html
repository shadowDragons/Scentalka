<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f3ec;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-start-world"
        class="scene"
        data-composition-id="01-start-world"
        data-composition-src="compositions/frames/01-start-world.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-make-it-yours"
        class="scene"
        data-composition-id="02-make-it-yours"
        data-composition-src="compositions/frames/02-make-it-yours.html"
        data-start="6"
        data-duration="8.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-home"
        class="scene"
        data-composition-id="03-home"
        data-composition-src="compositions/frames/03-home.html"
        data-start="14"
        data-duration="10.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-hospital"
        class="scene"
        data-composition-id="04-hospital"
        data-composition-src="compositions/frames/04-hospital.html"
        data-start="24"
        data-duration="12.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-road-choice"
        class="scene"
        data-composition-id="05-road-choice"
        data-composition-src="compositions/frames/05-road-choice.html"
        data-start="36"
        data-duration="10.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-three-voices"
        class="scene"
        data-composition-id="06-three-voices"
        data-composition-src="compositions/frames/06-three-voices.html"
        data-start="46"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-07-keep-records"
        class="scene"
        data-composition-id="07-keep-records"
        data-composition-src="compositions/frames/07-keep-records.html"
        data-start="54"
        data-duration="10.4"
        data-track-index="0"
      ></div>

      <div
        id="el-08-voice-review"
        class="scene"
        data-composition-id="08-voice-review"
        data-composition-src="compositions/frames/08-voice-review.html"
        data-start="64"
        data-duration="11"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-start-world", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-make-it-yours", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.to("#el-02-make-it-yours", { x: 1920, duration: 0.5, ease: "power3.inOut" }, 14);
        tl.fromTo("#el-03-home", { x: -1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 14);
        tl.to("#el-03-home", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 24);
        tl.fromTo("#el-04-hospital", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 24);
        tl.to("#el-04-hospital", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 36);
        tl.fromTo("#el-05-road-choice", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 36);
        tl.to("#el-05-road-choice", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 46);
        tl.fromTo("#el-06-three-voices", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 46);
        tl.to("#el-07-keep-records", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 64);
        tl.fromTo("#el-08-voice-review", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 64);
        tl.to({}, { duration: 75 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
